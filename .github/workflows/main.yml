name: Build Launcher APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          mkdir -p app_pojavlauncher/libs
          cd app_pojavlauncher/libs
          wget -q https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar || true

      - name: Get Latest JRE Releases
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-new
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-21
          RELEASES=$(curl -s https://api.github.com/repos/PojavLauncherTeam/android-openjdk-build-multiarch/releases)
          JRE8_URL=$(echo "$RELEASES" | grep -o 'https://[^"]*jre8-pojav\.zip' | head -n 1)
          JRE17_URL=$(echo "$RELEASES" | grep -o 'https://[^"]*jre17-pojav\.zip' | head -n 1)
          JRE21_URL=$(echo "$RELEASES" | grep -o 'https://[^"]*jre21-pojav\.zip' | head -n 1)
          if [ -n "$JRE8_URL" ]; then wget -q -O jre8.zip "$JRE8_URL" && unzip -q jre8.zip -d app_pojavlauncher/src/main/assets/components/jre; fi
          if [ -n "$JRE17_URL" ]; then wget -q -O jre17.zip "$JRE17_URL" && unzip -q jre17.zip -d app_pojavlauncher/src/main/assets/components/jre-new; fi
          if [ -n "$JRE21_URL" ]; then wget -q -O jre21.zip "$JRE21_URL" && unzip -q jre21.zip -d app_pojavlauncher/src/main/assets/components/jre-21; fi
          rm -f jre8.zip jre17.zip jre21.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          chmod +x gradlew
          chmod +x ./scripts/languagelist_updater.sh
          ./scripts/languagelist_updater.sh
          mkdir -p out
          ./gradlew :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate dummy google-services.json
        run: |
          PKG=$(grep -E 'applicationId\s+["'\'']' app_pojavlauncher/build.gradle | head -n 1 | sed -E 's/.*["'\'']([^"'\'']+)["'\''].*/\1/')
          cat <<EOF > app_pojavlauncher/google-services.json
          {
            "project_info": {
              "project_number": "123456789000",
              "firebase_url": "https://dummy-launcher-project-default-rtdb.firebaseio.com",
              "project_id": "dummy-launcher-project",
              "storage_bucket": "dummy-launcher-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:1234567890abcdef",
                  "android_client_info": {
                    "package_name": "${PKG}"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForGitHubActionsBuild12345"
                  }
                ]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789000:android:abcdef1234567890",
                  "android_client_info": {
                    "package_name": "${PKG}.debug"
                  }
                },
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForGitHubActionsBuild12345"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Debug APK
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon
          cp app_pojavlauncher/build/outputs/apk/debug/*.apk out/launcher-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: out/launcher-debug.apk
