name: Build Launcher APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          mkdir -p app_pojavlauncher/libs
          cd app_pojavlauncher/libs
          wget https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar

      - name: Get JRE 8, 17, and 21
        run: |
          mkdir -p app_pojavlauncher/src/main/assets/components/jre
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-new
          mkdir -p app_pojavlauncher/src/main/assets/components/jre-21
          wget -O jre8.zip https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre8-pojav/jre8-pojav.zip
          unzip -q jre8.zip -d app_pojavlauncher/src/main/assets/components/jre
          wget -O jre17.zip https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre17-pojav/jre17-pojav.zip
          unzip -q jre17.zip -d app_pojavlauncher/src/main/assets/components/jre-new
          wget -O jre21.zip https://github.com/PojavLauncherTeam/android-openjdk-build-multiarch/releases/download/jre21-pojav/jre21-pojav.zip
          unzip -q jre21.zip -d app_pojavlauncher/src/main/assets/components/jre-21
          rm -f jre8.zip jre17.zip jre21.zip

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

